<text x="70" y="294" font-size="34" font-weight="700" fill="#f1f1f6">A <tspan fill="#4fd1c5">thousand</tspan> repositories.</text>
<text x="71" y="346" font-size="21" fill="#a3a4b5">An agent skill for Claude Code, Hermes Agent and Codex</text>
