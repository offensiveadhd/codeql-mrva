<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="bt bd">
<title id="bt">codeql-mrva</title>
<desc id="bd">codeql-mrva: one CodeQL query, a thousand repositories. An agent skill for Claude Code, Hermes Agent and Codex. A query chip sends a wave across a grid of repositories; most come back with nothing, six light up with results, and triage keeps two as real and feeds the other four back into the query.</desc>
