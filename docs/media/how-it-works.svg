<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" role="img" aria-labelledby="wt wd">
<title id="wt">How codeql-mrva works</title>
<desc id="wd">The agent, with the codeql-mrva skill, submits a query pack and a repository list to a controller repository you own. Its GitHub Actions workflow fans out one job per repository and runs the query on the CodeQL database GitHub already stores for it. SARIF comes back per repository; the agent turns it into a triage table, and each real finding is reported privately.</desc>
