<text class="m" x="490" y="300" font-size="24" font-weight="700" opacity="0">gh mrva submit<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.001;0.011;0.28;0.29;1"/></text>
<text x="490" y="336" font-size="20" style="fill:#4fd1c5" opacity="0">The pack and the list go to the controller repository.<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.001;0.011;0.28;0.29;1"/></text>
<text class="m" x="490" y="300" font-size="24" font-weight="700" opacity="0">one job per repository<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.29;0.3;0.54;0.55;1"/></text>
<text x="490" y="336" font-size="20" style="fill:#4fd1c5" opacity="0">Each job runs the query on the database GitHub already stores.<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.29;0.3;0.54;0.55;1"/></text>
<text class="m" x="490" y="300" font-size="24" font-weight="700" opacity="0">SARIF streams back<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.77;0.78;1"/></text>
<text x="490" y="336" font-size="20" style="fill:#f5a524" opacity="0">Results arrive per repository as each job finishes.<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.77;0.78;1"/></text>
<text class="m" x="490" y="300" font-size="24" font-weight="700" opacity="0">mrva_sarif.py results/<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.78;0.79;0.989;0.999;1"/></text>
<text x="490" y="336" font-size="20" style="fill:#4ade80" opacity="0">A triage table and a hits list; real ones go out privately.<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.78;0.79;0.989;0.999;1"/></text>
<text x="60" y="410" font-size="20" style="fill:#a3a4b5">Local shape: under about 50 repositories, download the databases and run codeql yourself. Same pack, same triage.</text>
